name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    services:

      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: text_to_sql_db

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Initialize database
        env:
          MYSQL_PWD: test
        run: |
          mysql -h 127.0.0.1 -u root text_to_sql_db < database/schema.sql
          mysql -h 127.0.0.1 -u root text_to_sql_db < database/seed.sql


      - name: Run tests
        env:
          DATABASE_USER: root
          DATABASE_PASSWORD: test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: text_to_sql_db
          JWT_SECRET_KEY: test-secret
        run: |
          pytest -v